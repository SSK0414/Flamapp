<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bezier Rope</title>
<style>
  html,body{height:100%;margin:0;background:#0b0f14;color:#e7eef7;font-family:system-ui,Arial;overflow:hidden}
  svg{width:100vw;height:100vh;background:linear-gradient(#071019,#0b0f14);display:block}
  rect{fill:rgba(255,255,255,0.02);stroke:rgba(255,255,255,0.04);rx:8}
  .grid-line{stroke:rgba(255,255,255,0.03);stroke-width:1}
  .handle-line{stroke:rgba(121,199,255,0.18);stroke-width:1.3}
  .curve{stroke:#79c7ff;stroke-width:3;fill:none;stroke-linecap:round}
  .tangent{stroke:#ffffff;border-color:#071019;stroke-width:2.5;stroke-linecap:round;}
  circle{cursor:grab;stroke-width:1.2}
  text.lab{fill:#e7eef7;font-size:12px;font-family:Menlo,monospace;text-anchor:middle;pointer-events:none}  
  #hud{position:fixed;left:12px;top:12px;background:rgba(255,255,255,0.04);padding:8px 10px;border-radius:8px;font-size:13px}
</style>
</head>
<body>
  <div id="hud">
    <div><strong style="color:#79c7ff">Bezier Rope</strong></div>
    <div id="params">stiff: —  damp: —</div>
    <div class="muted">Drag handles. W/S A/D for changing. R reset</div>
  </div>

  <svg id="svg" aria-label="Bezier rope">
    <!-- centered square -->
    <rect id="box"></rect>

    <g id="grid"></g>

    <path id="handleLineLeft" class="handle-line"></path>
    <path id="handleLineRight" class="handle-line"></path>

    <path id="curvePath" class="curve"></path>

    <g id="tangents">
      <line class="tangent" id="t0"/><line class="tangent" id="t1"/><line class="tangent" id="t2"/>
      <line class="tangent" id="t3"/><line class="tangent" id="t4"/><line class="tangent" id="t5"/>
      <line class="tangent" id="t6"/><line class="tangent" id="t7"/><line class="tangent" id="t8"/>
      <line class="tangent" id="t9"/><line class="tangent" id="t10"/><line class="tangent" id="t11"/>
      <line class="tangent" id="t12"/><line class="tangent" id="t13"/><line class="tangent" id="t14"/>
      <line class="tangent" id="t15"/><line class="tangent" id="t16"/>
    </g>

    <!-- control points and labels -->
    <circle id="circleP1" r="8" fill="#9be7ff" stroke="#072635"></circle>
    <circle id="circleP2" r="8" fill="#ffd28c" stroke="#3b2f10"></circle>
    <text id="labelP1" class="lab"></text>
    <text id="labelP2" class="lab"></text>
  </svg>

  <script src="main.js"></script>
</body>
</html>
